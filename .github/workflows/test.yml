on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

name: tests

# Cancel a run that a newer push has made out of date
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The R side of the analysis (analysis.R): signal validity, the analysis window, the sleep
  # summary, the LightGBM predictor against fixtures made with the real LightGBM, and the pipeline
  # stages on fake state. Needs no mrpheus.
  r:
    name: R tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Install packages
        run: |
          install.packages(c("testthat", "tibble", "jsonlite"))
          # hypnoR is optional: with a version that has `waso_until` the comparison against the
          # built-in summary runs, with an older one the fallback is tested instead.
          tryCatch(
            install.packages("hypnoR", repos = c("https://circadia-bio.r-universe.dev", getOption("repos"))),
            error = function(e) message("hypnoR not installed: ", conditionMessage(e))
          )
          if (requireNamespace("hypnoR", quietly = TRUE)) {
            cat("hypnoR", as.character(packageVersion("hypnoR")), "| waso_until:",
                "waso_until" %in% names(formals(hypnoR::compute_sleep_architecture)), "\n")
          } else {
            cat("hypnoR is not installed\n")
          }
        shell: Rscript {0}

      - name: Run tests
        run: testthat::test_dir("tests/r", stop_on_failure = TRUE)
        shell: Rscript {0}

  # Which channels the page chooses, and the reduction of the EDF to those channels, checked
  # sample by sample. R's edfReader (the reader mrpheus uses) reads the reduced file back, so
  # this job also needs R.
  js:
    name: JavaScript tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Install edfReader
        run: install.packages("edfReader")
        shell: Rscript {0}

      - name: Run tests
        run: node --test tests/js/channels.test.mjs tests/js/edf.test.mjs
